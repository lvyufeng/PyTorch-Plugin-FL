# Commands run from the default branch, with code from the resolved PR commit.
# Only repository writers can start hardware jobs through this privileged route.
name: Slash command (/ci)

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number whose current head needs CI'
        required: true
        type: string
      platforms:
        description: 'Comma-separated platforms, or all'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: CI-pr-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Handle /ci command
    # Manual dispatch is a trusted retry path for a maintainer. It still resolves
    # the open PR's current head instead of letting the caller provide a SHA.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      requested_platforms: ${{ steps.handle.outputs.requested_platforms }}
      pr_number: ${{ steps.handle.outputs.pr_number }}
      revision: ${{ steps.handle.outputs.revision }}
    steps:
      - name: Checkout trusted control scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci
            .github/configs

      - name: Install configuration parser
        run: python -m pip install PyYAML

      - name: Handle maintainer command
        id: handle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python .github/scripts/ci/slash_command.py

  create-ci:
    needs: dispatch
    if: ${{ needs.dispatch.outputs.requested_platforms != '' && !cancelled() }}
    permissions:
      actions: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start CI for the PR's current head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.dispatch.outputs.pr_number }}
          PLATFORMS: ${{ needs.dispatch.outputs.requested_platforms }}
          REVISION: ${{ needs.dispatch.outputs.revision }}
        run: |
          set -euo pipefail
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            --method POST \
            --input - <<JSON
          {"ref":"main","inputs":{"platforms":"${PLATFORMS}","pr_number":"${PR_NUMBER}","revision":"${REVISION}"}}
          JSON
